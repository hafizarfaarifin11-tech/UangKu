
name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Extract UangKu Project
        run: |
          unzip -q UangKu-EWallet-Android-CI.zip -d project

          echo "Checking project files..."
          ls -la project/UangKu-EWallet

          test -f project/UangKu-EWallet/settings.gradle

      - name: Build UangKu APK
        working-directory: project/UangKu-EWallet
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UangKu-debug-apk
          path: project/UangKu-EWallet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
